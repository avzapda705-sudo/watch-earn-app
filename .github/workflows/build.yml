name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Repair Flutter & Fix SDK Versions
        run: |
          flutter create --platforms=android --project-name watch_earn_app --org com.watchearn .
          echo "android.ndkVersion=27.0.12077973" >> android/local.properties
          
          # minSdkVersion ને ગ્રેડલમાં ગમે તે ફોર્મેટ હોય સીધું 23 કરી દેશે
          sed -i 's/minSdkVersion.*/minSdkVersion 23/g' android/app/build.gradle 2>/dev/null || true
          sed -i 's/minSdk =.*/minSdk = 23/g' android/app/build.gradle 2>/dev/null || true
          sed -i 's/flutter.minSdkVersion/23/g' android/app/build.gradle 2>/dev/null || true

          # Kotlin વર્ઝન ફિક્સ
          sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "1.9.24"/' android/build.gradle 2>/dev/null || true
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.24"/' android/settings.gradle 2>/dev/null || true

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          
