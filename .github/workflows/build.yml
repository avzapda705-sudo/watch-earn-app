name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.10.6'
          channel: 'stable'

      - name: Fix Android v1 Embedding & NDK
        run: |
          echo "android.ndkVersion=27.0.12077973" >> android/local.properties
          # v1 embedding નો એરર આપતો જૂનો ટેગ હટાવવો
          find android/ -name "AndroidManifest.xml" -exec sed -i '/android.app.lib_name/d' {} +
          find android/ -name "AndroidManifest.xml" -exec sed -i '/flutterEmbedding/d' {} +

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          
