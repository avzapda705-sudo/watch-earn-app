name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Clean Setup & Decode App
        run: |
          if [ ! -f "android/build.gradle" ]; then
            flutter create --platforms=android --project-name watch_earn_app .
          fi
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

          sed -i 's/minSdkVersion.*/minSdkVersion 23/g' android/app/build.gradle 2>/dev/null || true
          sed -i 's/minSdk =.*/minSdk = 23/g' android/app/build.gradle 2>/dev/null || true

          if [ -f "android/settings.gradle" ]; then
            sed -i 's/id "org.jetbrains.kotlin.android" version .*/id "org.jetbrains.kotlin.android" version "1.9.24" apply false/g' android/settings.gradle 2>/dev/null || true
          fi
          if [ -f "android/build.gradle" ]; then
            sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = '\''1.9.24'\''/g' android/build.gradle 2>/dev/null || true
          fi

          sed -i '/google-services/d' android/build.gradle 2>/dev/null || true
          sed -i '/google-services/d' android/app/build.gradle 2>/dev/null || true
          sed -i '/google-services/d' android/settings.gradle 2>/dev/null || true

          mkdir -p lib
          echo "
