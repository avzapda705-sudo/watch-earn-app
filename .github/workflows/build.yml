name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Fix Missing Code and Config
        run: |
          if [ ! -f "android/build.gradle" ]; then
            flutter create --platforms=android --project-name watch_earn_app --org com.watchearn .
          fi
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

          sed -i 's/minSdkVersion.*/minSdkVersion 23/g' android/app/build.gradle 2>/dev/null || true
          sed -i 's/minSdk =.*/minSdk = 23/g' android/app/build.gradle 2>/dev/null || true

          if [ -f "android/settings.gradle" ]; then
            sed -i 's/id "org.jetbrains.kotlin.android" version.*/id "org.jetbrains.kotlin.android" version "1.9.24" apply false/g' android/settings.gradle 2>/dev/null || true
            if ! grep -q "com.google.gms.google-services" android/settings.gradle 2>/dev/null; then
              sed -i '/plugins {/a \    id "com.google.gms.google-services" version "4.4.2" apply false' android/settings.gradle 2>/dev/null || true
            fi
          fi

          if [ -f "android/build.gradle" ]; then
            sed -i 's/ext.kotlin_version =.*/ext.kotlin_version = '\''1.9.24'\''/g' android/build.gradle 2>/dev/null || true
          fi

          if ! grep -q "com.google.gms.google-services" android/app/build.gradle 2>/dev/null; then
            sed -i '/plugins {/a \    id "com.google.gms.google-services"' android/app/build.gradle 2>/dev/null || echo 'apply plugin: "com.google.gms.google-services"' >> android/app/build.gradle
          fi

          # Fix incomplete line in lib/main.dart automatically
          sed -i '/border: Border.all(color: const Color(0xFF6C63FF), width: 2)/c\            border: Border.all(color: const Color(0xFF6C63FF), width: 2),),),child: Center(child: Text(_finished ? "Video Complete!" : "Watching Ad...", style: const TextStyle(fontSize: 16))),),const SizedBox(height: 20),if (_finished) ElevatedButton(onPressed: () => Navigator.pop(context), child: const Text("Back & Claim Coins")) else const Text("Wait...", style: TextStyle(color: Colors.white38)),],),);}}' lib/main.dart

          flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          
