name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Repair Android & Firebase Configuration
        run: |
          if [ ! -f "android/build.gradle" ]; then
            flutter create --platforms=android --project-name watch_earn_app --org com.watchearn .
          fi
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

          # minSdk 23
          sed -i 's/minSdkVersion.*/minSdkVersion 23/g' android/app/build.gradle 2>/dev/null || true
          sed -i 's/minSdk =.*/minSdk = 23/g' android/app/build.gradle 2>/dev/null || true

          # Android root build.gradle setup for Google Services
          cat << 'EOF' > android/build.gradle
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.buildDir = '../build'
          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
          }
          subprojects {
              project.evaluationDependsOn(':app')
          }

          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          EOF

          # Add google services classpath to android/settings.gradle or build.gradle
          if [ -f "android/settings.gradle" ]; then
            sed -i '/plugins {/a \    id "com.google.gms.google-services" version "4.4.2" apply false' android/settings.gradle 2>/dev/null || true
          fi

          if ! grep -q "com.google.gms.google-services" android/app/build.gradle 2>/dev/null; then
            sed -i '/plugins {/a \    id "com.google.gms.google-services"' android/app/build.gradle 2>/dev/null || echo 'apply plugin: "com.google.gms.google-services"' >> android/app/build.gradle
          fi

          flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          
